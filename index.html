<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice — Mathematics (Form K)</title>
<style>
:root{
  --ink:#16202e; --ink-soft:#5a6579; --ink-faint:#8b94a5;
  --rule:#dde3ec; --canvas:#eef1f6; --card:#fff;
  --accent:#1f5aa8; --accent-soft:#e9f0fa; --accent-deep:#16416f;
  --amber:#8a6114; --amber-bg:#fdf3dd; --amber-line:#e7cf9a;
  --danger:#b42318; --ok:#15803d;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--ui);
     font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}

.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.bar-in{max-width:1000px;margin:0 auto;padding:12px 24px;display:flex;
        align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{color:#93a3bb;font-weight:500}
.count{font-size:14px;color:#c2ccdb;font-variant-numeric:tabular-nums}
.track{height:3px;background:#0d1725}
.track i{display:block;height:100%;background:#5b9bd8;transition:width .25s ease}

.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;
      padding:34px 42px;margin:28px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.qnum{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--ink-faint)}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
       color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-line);
       padding:2px 8px;border-radius:4px}
h1{font-size:29px;line-height:1.25;margin:0 0 15px}
h2{font-size:16px;font-weight:700;margin:26px 0 10px}
.lede{color:var(--ink-soft);margin:0 0 20px}

.stem{font-size:19px;line-height:1.6}
.stem p{margin:0 0 12px}
.stem ul{margin:10px 0 12px;padding-left:22px}
.stem li{margin-bottom:5px}
.disp{text-align:center;margin:18px 0;font-size:19px}
.fig{text-align:center;margin:18px 0;color:var(--ink)}
.fig svg{max-width:100%;height:auto}
.frac{display:inline-block;vertical-align:middle;text-align:center;
      font-size:.92em;line-height:1.15;margin:0 2px}
.frac .num{display:block;padding:0 3px}
.frac .den{display:block;border-top:1px solid currentColor;padding:0 3px}
.ovl{border-top:1px solid currentColor}
sup{font-size:.72em;vertical-align:super;line-height:0}
.tbl-title{text-align:center;font-size:15px;margin-bottom:7px}
table.data{border-collapse:collapse;margin:0 auto 14px}
table.data th,table.data td{border:1px solid var(--ink);padding:6px 14px;
      font-size:15.5px;text-align:center}

.choices{margin-top:24px;display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;
        background:#fff;border:1.5px solid var(--rule);border-radius:8px;
        padding:15px 18px;cursor:pointer;font-size:18.5px;line-height:1.55;color:var(--ink);
        transition:border-color .12s,background .12s}
.choice:hover{border-color:#b9c4d4;background:#fafbfd}
.choice .ltr{flex:none;width:29px;height:29px;border-radius:50%;border:1.5px solid #c3ccd9;
        display:flex;align-items:center;justify-content:center;font-size:14px;
        font-weight:700;color:var(--ink-soft);margin-top:1px}
.choice.on{border-color:var(--accent);background:var(--accent-soft)}
.choice.on .ltr{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}

.grid-in{margin-top:24px}
.grid-in label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);
       margin-bottom:8px}
.grid-in input{width:240px;font-size:25px;font-family:var(--ui);font-weight:600;
       padding:14px 16px;border:1.5px solid #c3ccd9;border-radius:8px;
       text-align:center;letter-spacing:.04em}
.grid-in input:focus{outline:none;border-color:var(--accent);
       box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:13px;color:var(--ink-faint);margin-top:9px}
.paper-note{margin:16px 0 0;padding:14px 16px;border-left:4px solid #c9821f;
     background:#fdf6ea;border-radius:0 7px 7px 0;font-size:16px;line-height:1.55}
.paper-note b{color:#8a5a10}
.badge.paper{background:#fdf0da;color:#8a5a10;border-color:#e6c48a}
.paperflag{margin:0 0 20px;padding:13px 16px;border-left:4px solid #c9821f;
     background:#fdf6ea;border-radius:0 7px 7px 0;font-size:15.5px}

.actions{display:flex;align-items:center;justify-content:space-between;gap:14px;
      margin-top:28px;padding-top:20px;border-top:1px solid var(--rule)}
.note{font-size:13.5px;color:var(--ink-faint);max-width:400px}
.btns{display:flex;align-items:center;gap:10px}
.btn{border:none;border-radius:8px;padding:13px 26px;font-size:16px;font-weight:600;
     cursor:pointer;transition:background .12s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-deep)}
.btn-ghost{background:none;color:var(--ink-soft);border:1.5px solid var(--rule);
     padding:12px 18px}
.btn-ghost:hover{background:#f3f5f9;color:var(--ink)}
.btn:focus-visible{outline:3px solid #9dc3ec;outline-offset:2px}
.arrow{width:62px;height:62px;border-radius:50%;border:none;background:var(--accent);
     color:#fff;font-size:28px;line-height:1;cursor:pointer;display:flex;
     align-items:center;justify-content:center;transition:background .12s,transform .12s}
.arrow:hover{background:var(--accent-deep);transform:translateX(2px)}
.arrow.finish{background:var(--ok)}
.arrow.finish:hover{background:#136c34;transform:none}
.arrow:focus-visible{outline:3px solid #9dc3ec;outline-offset:3px}

.rules{list-style:none;padding:0;margin:0 0 6px}
.rules li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule);
      font-size:16px;color:var(--ink-soft)}
.rules li:last-child{border-bottom:none}
.rules b{color:var(--ink);font-weight:650;flex:none;width:146px}
.stats{display:flex;gap:34px;margin:6px 0 22px;flex-wrap:wrap}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint)}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
table.sheet{width:100%;border-collapse:collapse;margin-top:6px}
table.sheet th{text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
      color:var(--ink-faint);border-bottom:1.5px solid var(--rule);padding:8px 10px}
table.sheet td{border-bottom:1px solid #eef1f6;padding:9px 11px;font-size:16px;
      font-variant-numeric:tabular-nums}
table.sheet td.q{color:var(--ink-faint);width:56px}
table.sheet td.you{font-weight:650}
.blank{color:var(--danger);font-weight:650}
.right{color:var(--ok);font-weight:650}
.wrong{color:var(--danger);font-weight:650}
.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 26px}
@media(max-width:700px){.sheetgrid{grid-template-columns:1fr}}

.modal{position:fixed;inset:0;z-index:60;background:rgba(16,24,38,.55);
      display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:#fff;border-radius:12px;padding:26px 28px;max-width:420px;width:100%;
      box-shadow:0 18px 50px rgba(10,18,32,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 20px;color:var(--ink-soft);font-size:15px}
.modal-btns{display:flex;justify-content:flex-end;gap:10px}

.printhead{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.ph-title{font-size:15px;font-weight:700}
.ph-meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.namefield{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.namefield label{font-size:13px;font-weight:600;color:var(--ink-soft)}
.namefield input{flex:1;max-width:280px;font-family:var(--ui);font-size:15px;padding:8px 12px;
      border:1.5px solid #c3ccd9;border-radius:8px}
.namefield input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tip{font-size:12.5px;color:var(--ink-faint);margin-top:12px}
.missed{font-size:17px;font-weight:600;color:var(--danger);margin:0 0 4px;
      font-variant-numeric:tabular-nums;line-height:1.6}
.btns{flex-wrap:wrap;justify-content:flex-end}
.rev-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
      flex-wrap:wrap;margin-bottom:4px}
.verdict{font-size:14px;font-weight:650}
.correct-note{margin-top:20px;padding:13px 16px;border-radius:8px;background:#f2f8f4;
      border:1px solid #cfe6d8;font-size:16px}
.correct-note b{color:var(--ok)}

@media(max-width:640px){
  .card{padding:22px 18px;border-radius:8px}
  .bar-in{padding:9px 14px}.wrap{padding:0 12px}
  h1{font-size:22px}.stem,.choice{font-size:16.5px}
  .actions{flex-direction:column;align-items:stretch}
  .btns{justify-content:space-between}.note{max-width:none}
  .arrow{width:54px;height:54px;font-size:25px}
}
@media print{
  @page{margin:14mm}
  .bar,.track,.actions,.noprint,.modal,.namefield{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .card{border:none;margin:0;padding:0;border-radius:0}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:13px;margin:14px 0 6px}
  .stats{gap:26px;margin:4px 0 12px}.stat .v{font-size:19px}
  .sheetgrid{gap:0 18px}
  table.sheet td,table.sheet th{padding:2.5px 7px;font-size:11px}
  tr{page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

<script>
(function(){

var DATA = [{"type": "mc", "stem": "<p>What is the value of the expression below?</p><div class='disp'>&radic;<span class='ovl'>&nbsp;36 + 64&nbsp;</span></div>", "choices": [{"letter": "A", "html": "10"}, {"letter": "B", "html": "14"}, {"letter": "C", "html": "50"}, {"letter": "D", "html": "100"}], "answer": "A", "n": 1}, {"type": "mc", "stem": "<div class='disp'>0.486 &divide; 54 =</div>", "choices": [{"letter": "E", "html": "0.0009"}, {"letter": "F", "html": "0.009"}, {"letter": "G", "html": "0.09"}, {"letter": "H", "html": "0.9"}], "answer": "F", "n": 2}, {"type": "mc", "stem": "<p>Priya read 4 times as many pages as Deshawn read. Together they read 85 pages. How many pages did Priya read?</p>", "choices": [{"letter": "A", "html": "17"}, {"letter": "B", "html": "21"}, {"letter": "C", "html": "68"}, {"letter": "D", "html": "72"}], "answer": "C", "n": 3}, {"type": "grid", "stem": "<p>A single grain of a certain fertilizer weighs 35 milligrams. What is the weight of one grain, in grams?</p>", "choices": [], "answer": "0.035", "n": 4}, {"type": "mc", "stem": "<p>Line <i>p</i> is parallel to line <i>q</i>, and both lie in the same plane. How many points do line <i>p</i> and line <i>q</i> have in common?</p>", "choices": [{"letter": "A", "html": "0"}, {"letter": "B", "html": "1"}, {"letter": "C", "html": "2"}, {"letter": "D", "html": "Infinitely many"}], "answer": "A", "n": 5}, {"type": "mc", "stem": "<p>Nadia is taller than Omar but shorter than Priya. If <i>n</i>, <i>o</i>, and <i>p</i> represent their heights, respectively, which of the following is true?</p>", "choices": [{"letter": "E", "html": "<i>o</i> &lt; <i>n</i> &lt; <i>p</i>"}, {"letter": "F", "html": "<i>o</i> &lt; <i>p</i> &lt; <i>n</i>"}, {"letter": "G", "html": "<i>n</i> &lt; <i>o</i> &lt; <i>p</i>"}, {"letter": "H", "html": "<i>p</i> &lt; <i>n</i> &lt; <i>o</i>"}], "answer": "E", "n": 6}, {"type": "mc", "stem": "<p>How many inches are there in <i>y</i> yards and <i>f</i> feet? <i>(Note: 1 yard = 36 inches and 1 foot = 12 inches.)</i></p>", "choices": [{"letter": "A", "html": "36<i>y</i> + 12<i>f</i>"}, {"letter": "B", "html": "12(<i>y</i> + <i>f</i>)"}, {"letter": "C", "html": "36(<i>y</i> + <i>f</i>)"}, {"letter": "D", "html": "<span class=\"frac\"><span class=\"num\"><i>y</i></span><span class=\"den\">36</span></span> + 12<i>f</i>"}], "answer": "A", "n": 7}, {"type": "mc", "stem": "<div class='disp'>5<i>x</i> + 3 &minus; 8<i>x</i> = 9 &minus; 6<i>x</i> + 12</div><p>What is the value of <i>x</i> in the equation above?</p>", "choices": [{"letter": "E", "html": "6"}, {"letter": "F", "html": "4"}, {"letter": "G", "html": "<span class=\"frac\"><span class=\"num\">8</span><span class=\"den\">3</span></span>"}, {"letter": "H", "html": "&minus;6"}], "answer": "E", "n": 8}, {"type": "mc", "stem": "<p>If <span class=\"frac\"><span class=\"num\">4</span><span class=\"den\">9</span></span> of <i>M</i> is 216, what is <span class=\"frac\"><span class=\"num\">7</span><span class=\"den\">9</span></span> of <i>M</i>?</p>", "choices": [{"letter": "A", "html": "336"}, {"letter": "B", "html": "378"}, {"letter": "C", "html": "432"}, {"letter": "D", "html": "486"}], "answer": "B", "n": 9}, {"type": "mc", "stem": "<p>The table below shows five pairs of values for <i>x</i> and <i>y</i>.</p><table class='data'><tr><th><i>x</i></th><th><i>y</i></th></tr><tr><td>1</td><td>9</td></tr><tr><td>2</td><td>14</td></tr><tr><td>3</td><td>19</td></tr><tr><td>4</td><td>24</td></tr><tr><td>12</td><td>64</td></tr></table><p>Which equation describes the relationship shown in the table?</p>", "choices": [{"letter": "E", "html": "<i>y</i> = <i>x</i> + 8"}, {"letter": "F", "html": "<i>y</i> = 5<i>x</i> + 4"}, {"letter": "G", "html": "<i>y</i> = 4<i>x</i> + 5"}, {"letter": "H", "html": "<i>y</i> = 8<i>x</i> + 1"}], "answer": "F", "n": 10}, {"type": "mc", "stem": "<p>Rectangle <i>JKLM</i> is similar to rectangle <i>PQRS</i>.</p><div class=\"fig\"><svg viewBox=\"0 0 460 176\" width=\"460\" height=\"176\" var TOTAL = DATA.length;
var PAPER_Q = (function(){ for (var i=0;i<DATA.length;i++){ if (DATA[i].paper) return DATA[i].n; } return 0; })();
var STORE = "shsat_formK_math_v1";

var idx = 0, answers = {}, pending = null, elapsed = 0;
var mode = "start", reviewIdx = 0, ticker = null;

var app = document.getElementById("app");
var bar = document.getElementById("bar");
var track = document.getElementById("track");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function fmt(sec){
  if (sec < 0) sec = 0;
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h + ":" + (m<10?"0":"") + m + ":" + (s<10?"0":"") + s;
}
function norm(v){
  return String(v == null ? "" : v).trim()
    .replace(/&minus;/g,"-").replace(/\u2212/g,"-").replace(/[$,%\s]/g,"");
}
function sameAnswer(a, b){
  var x = norm(a), y = norm(b);
  if (!x) return false;
  if (x === y) return true;
  var fx = parseFloat(x), fy = parseFloat(y);
  return !isNaN(fx) && !isNaN(fy) && Math.abs(fx - fy) < 1e-9;
}
function answeredCount(){
  var c = 0; for (var k in answers){ if (norm(answers[k])) c++; } return c;
}

function ask(heading, message, yesLabel, onYes){
  var m = document.getElementById("modal");
  document.getElementById("modal-h").textContent = heading;
  document.getElementById("modal-p").textContent = message;
  var yes = document.getElementById("modal-yes"), no = document.getElementById("modal-no");
  yes.textContent = yesLabel; m.hidden = false; yes.focus();
  function close(){ m.hidden = true; yes.onclick = null; no.onclick = null; }
  yes.onclick = function(){ close(); onYes(); };
  no.onclick = close;
}
function printSheet(){
  var name = (document.getElementById("student") || {}).value || "";
  var slot = document.getElementById("phname");
  if (slot) slot.textContent = name ? name : "\u2014";
  try { window.print(); } catch (e) {}
}

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(
    {idx:idx, answers:answers, elapsed:elapsed, mode:mode})); }catch(e){}
}
function load(){
  try{ var r = localStorage.getItem(STORE); return r ? JSON.parse(r) : null; }catch(e){ return null; }
}
function wipe(){ try{ localStorage.removeItem(STORE); }catch(e){} }

function tick(){ elapsed++; if (elapsed % 15 === 0) save(); }
function startTicker(){ if (ticker) clearInterval(ticker); ticker = setInterval(tick, 1000); }
function stopTicker(){ if (ticker){ clearInterval(ticker); ticker = null; } }

function paintChrome(){
  var showing = (mode === "test");
  bar.hidden = !showing; track.hidden = !showing;
  if (!showing) return;
  document.getElementById("count").textContent = answeredCount() + " of " + TOTAL + " answered";
  document.getElementById("trackbar").style.width = ((idx / TOTAL) * 100) + "%";
}

    '<div class="actions">' +
      '<div class="note">Scratch paper and a pencil are allowed. Calculators are not.</div>' +
      '<div class="btns">' +
        (canResume ? '<button class="btn btn-ghost" id="resume">Resume at question ' +
           DATA[saved.idx].n + '</button>' : '') +
        '<button class="btn btn-primary" id="begin">Begin test</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function screenQuestion(){
  var q = DATA[idx], isLast = (idx === TOTAL - 1), body;
  if (q.type === "grid"){
    body = '<div class="grid-in">' +
             '<label for="gridbox">Your answer</label>' +
             '<input id="gridbox" type="text" inputmode="text" autocomplete="off" ' +
                'spellcheck="false" value="' + esc(pending == null ? "" : pending) + '">' +
             '<div class="hint">Numbers only. Use a minus sign for a negative answer and a ' +
               'decimal point if needed.</div>' +
           '</div>';
  } else {
    var rows = "";
    for (var i = 0; i < q.choices.length; i++){
      var c = q.choices[i];
      rows += '<button class="choice' + (pending === c.letter ? " on" : "") +
              '" data-letter="' + c.letter + '" type="button">' +
              '<span class="ltr">' + c.letter + '</span>' +
              '<span class="ct">' + c.html + '</span></button>';
    }
    body = '<div class="choices" role="group" aria-label="Answer choices">' + rows + '</div>';
  }
  return '' +
  '<div class="card">' +
    '<div class="eyebrow">' +
      '<span class="qnum">Question ' + q.n + ' of ' + TOTAL + '</span>' +
      (q.type === "grid" ? '<span class="badge' + (q.paper ? ' paper' : '') + '">' +
        (q.paper ? "Grid-in + paper" : "Grid-in") + '</span>' : '') +
    '</div>' +
    '<div class="stem">' + q.stem + '</div>' + body +
    '<div class="actions">' +
      '<div class="note">' + (isLast
        ? 'Last question. The arrow submits your test.'
        : 'Once you move on, this question closes.') + '</div>' +
      '<div class="btns">' +
        '<button class="arrow' + (isLast ? " finish" : "") + '" id="next" ' +
          'aria-label="' + (isLast ? "Finish test" : "Next question") + '" ' +
          'title="' + (isLast ? "Finish test" : "Next question") + '">' +
          (isLast ? "&#10003;" : "&rarr;") + '</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function printHead(label){
  var d = new Date();
  var date = d.toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
  return '<div class="printhead">' +
    '<div class="ph-title">SHSAT Practice &mdash; Mathematics &middot; Form K</div>' +
    '<div class="ph-meta">' + label + ' &nbsp;&middot;&nbsp; Name: <span id="phname">' +
      '&mdash;</span> &nbsp;&middot;&nbsp; ' + date + '</div></div>';
}

function sheetChunks(){
  var per = Math.ceil(TOTAL / 3), out = "";
  for (var c = 0; c < 3; c++){
    var rows = "";
    for (var i = c * per; i < Math.min((c + 1) * per, TOTAL); i++){
      var q = DATA[i], a = answers[q.n], has = !!norm(a);
      rows += '<tr><td class="q">' + q.n + '</td><td class="you' +
              (has ? '' : ' blank') + '">' + (has ? esc(a) : "&mdash;") + '</td></tr>';
    }
    if (rows) out += '<table class="sheet"><thead><tr><th>Q</th><th>Your answer</th>' +
                     '</tr></thead><tbody>' + rows + '</tbody></table>';
  }
  return '<div class="sheetgrid">' + out + '</div>';
}

function scored(){
  var right = 0, missed = [], rows = "";
  for (var i = 0; i < TOTAL; i++){
    var q = DATA[i], a = answers[q.n], has = !!norm(a), ok = sameAnswer(a, q.answer);
    if (ok) right++; else missed.push(q.n);
    rows += '<tr><td class="q">' + q.n + '</td>' +
            '<td class="' + (has ? (ok ? "right" : "wrong") : "you blank") + '">' +
            (has ? esc(a) : "&mdash;") + '</td>' +
            '<td>' + esc(q.answer) + '</td>' +
            '<td>' + (ok ? '<span class="right">correct</span>'
                         : '<span class="wrong">' + (has ? "incorrect" : "blank") + '</span>') +
            '</td></tr>';
  }
  return {right: right, missed: missed, rows: rows,
          pct: Math.round((right / TOTAL) * 100)};
}

function resultsText(){
  var s = scored();
  var name = (document.getElementById("student") || {}).value || "(no name)";
  var lines = [];
  lines.push("SHSAT Practice - Mathematics, Form K");
  lines.push("Student: " + name);
  lines.push("Date: " + new Date().toLocaleDateString());
  lines.push("");
  lines.push("SCORE: " + s.right + " / " + TOTAL + "  (" + s.pct + "%)");
  lines.push("Blank: " + (TOTAL - answeredCount()) + "     Time: " + fmt(elapsed));
  lines.push("");
  lines.push("Missed: " + (s.missed.length ? s.missed.join(", ") : "none"));
  if (PAPER_Q) lines.push("To grade on paper: number line graph for question " + PAPER_Q + ".");
  lines.push("");
  lines.push("Q    Yours   Key     Result");
  for (var i = 0; i < TOTAL; i++){
    var q = DATA[i], a = answers[q.n], has = !!norm(a), ok = sameAnswer(a, q.answer);
    var pad = function(v, n){ v = String(v); while (v.length < n) v += " "; return v; };
    lines.push(pad(q.n, 5) + pad(has ? a : "-", 8) + pad(q.answer, 8) +
               (ok ? "correct" : (has ? "INCORRECT" : "blank")));
  }
  return lines.join("\n");
}


function copyResults(){
  var txt = resultsText();
  var done = function(){
    var n = document.getElementById("mailnote");
    if (n) n.textContent = "Results copied. Paste them into an email or a document.";
  };
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt, done); });
    } else { fallbackCopy(txt, done); }
  }catch(e){ fallbackCopy(txt, done); }
}

function fallbackCopy(txt, done){
  try{
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){
    var n = document.getElementById("mailnote");
    if (n) n.textContent = "Copying was blocked here. Download this file and open it in your " +
          "browser, then try again.";
  }
}

function screenResults(){
  var s = scored();
  return '' +
  '<div class="card">' +
    printHead("Score report") +
    '<h1 class="noprint">Test complete</h1>' +
    '<p class="lede noprint">Your test has been scored. Add a name below if you want it ' +
      'on the printed report.</p>' +
    '<div class="namefield noprint"><label for="student">Student name</label>' +
      '<input id="student" type="text" autocomplete="off" placeholder="Optional, appears on the report"></div>' +
    (PAPER_Q ? '<div class="paperflag"><b>Still to be graded on paper:</b> the number line ' +
      'graph for question ' + PAPER_Q + '. The score below covers the typed answer to that ' +
      'question only.</div>' : '') +
    '<div class="stats">' +
      '<div class="stat"><div class="k">Raw score</div><div class="v">' +
         s.right + ' / ' + TOTAL + '</div></div>' +
      '<div class="stat"><div class="k">Percent</div><div class="v">' + s.pct + '%</div></div>' +
      '<div class="stat"><div class="k">Blank</div><div class="v">' +
         (TOTAL - answeredCount()) + '</div></div>' +
      '<div class="stat"><div class="k">Total time</div><div class="v">' + fmt(elapsed) + '</div></div>' +
    '</div>' +
    '<h2>Questions missed</h2>' +
    '<p class="missed">' + (s.missed.length ? s.missed.join(', ') : 'None &mdash; a perfect score.') + '</p>' +
    '<h2>Question by question</h2>' +
    '<table class="sheet"><thead><tr><th>Q</th><th>Yours</th><th>Key</th><th>Result</th></tr>' +
      '</thead><tbody>' + s.rows + '</tbody></table>' +
    '<div class="actions noprint">' +
      '<div class="note" id="mailnote">Save as PDF opens your browser print dialog; ' +
        'choose &ldquo;Save as PDF&rdquo; as the destination.</div>' +
      '<div class="btns">' +
        '<button class="btn btn-ghost" id="restart">Start over</button>' +
        '<button class="btn btn-ghost" id="copy">Copy results</button>' +
        '<button class="btn btn-ghost" id="walk">Review questions</button>' +
        '<button class="btn btn-primary" id="print">Save as PDF</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function screenReview(){
  var q = DATA[reviewIdx], a = answers[q.n], ok = sameAnswer(a, q.answer), body;
  if (q.type === "grid"){
    body = '<div class="grid-in"><label>Your answer</label>' +
           '<div style="font-size:25px;font-weight:600">' +
             (norm(a) ? esc(a) : '<span class="blank">left blank</span>') + '</div></div>';
  } else {
    var rows = "";
    for (var i = 0; i < q.choices.length; i++){
      var c = q.choices[i], on = (a === c.letter), key = (q.answer === c.letter);
      var tag = key ? ' &nbsp;<span class="right">&#10003; correct</span>'
                    : (on ? ' &nbsp;<span class="wrong">your answer</span>' : '');
      rows += '<div class="choice' + (key || on ? " on" : "") + '" style="cursor:default;' +
              (key ? "border-color:#15803d;background:#f2f8f4" :
                    (on ? "border-color:#b42318;background:#fdf3f2" : "")) + '">' +
              '<span class="ltr"' + (key ? ' style="background:#15803d;border-color:#15803d;color:#fff"' :
                                     (on ? ' style="background:#b42318;border-color:#b42318;color:#fff"' : '')) +
              '>' + c.letter + '</span><span class="ct">' + c.html + tag + '</span></div>';
    }
    body = '<div class="choices">' + rows + '</div>';
  }
  var note = q.type === "grid"
    ? '<div class="correct-note">Correct answer: <b>' + esc(q.answer) + '</b></div>' : '';
  return '' +
  '<div class="card">' +
    '<div class="rev-head">' +
      '<span class="qnum">Question ' + q.n + ' of ' + TOTAL + '</span>' +
      '<span class="verdict ' + (ok ? "right" : "wrong") + '">' +
        (ok ? "Correct" : (norm(a) ? "Incorrect" : "Blank")) + '</span>' +
    '</div>' +
    '<div class="stem">' + q.stem + '</div>' + body + note +
    '<div class="actions">' +
      '<div class="note">Review mode &mdash; you can move in both directions here.</div>' +
      '<div class="btns">' +
        '<button class="btn btn-ghost" id="rprev"' + (reviewIdx === 0 ? " disabled" : "") + '>Previous</button>' +
        '<button class="btn btn-ghost" id="rsheet">Back to report</button>' +
        '<button class="btn btn-primary" id="rnext"' +
          (reviewIdx === TOTAL - 1 ? " disabled" : "") + '>Next</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function render(){
  if (mode === "start")        app.innerHTML = screenStart();
  else if (mode === "test")    app.innerHTML = screenQuestion();
  else if (mode === "results") app.innerHTML = screenResults();
  else                         app.innerHTML = screenReview();
  paintChrome(); wire(); window.scrollTo(0, 0);
}

function wire(){
  var byId = function(id){ return document.getElementById(id); };
  var begin = byId("begin"), resume = byId("resume");
  if (begin) begin.onclick = function(){ beginTest(false); };
  if (resume) resume.onclick = function(){ beginTest(true); };

  var boxes = app.querySelectorAll(".choice[data-letter]");
  for (var i = 0; i < boxes.length; i++){
    boxes[i].onclick = function(){ pending = this.getAttribute("data-letter"); render(); };
  }
  var box = byId("gridbox");
  if (box){
    box.oninput = function(){ pending = this.value; };
    box.onkeydown = function(e){ if (e.key === "Enter"){ e.preventDefault(); advance(); } };
    box.focus();
  }
  var next = byId("next"); if (next) next.onclick = advance;

  var print = byId("print"); if (print) print.onclick = printSheet;
  var student = byId("student");
  if (student) student.oninput = function(){
    var slot = byId("phname"); if (slot) slot.textContent = this.value ? this.value : "\u2014";
  };
  var walk  = byId("walk");  if (walk)  walk.onclick = function(){ reviewIdx = 0; mode = "review"; render(); };
  var sheet = byId("rsheet");if (sheet) sheet.onclick = function(){ mode = "results"; render(); };
  var copyB = byId("copy");  if (copyB) copyB.onclick = copyResults;
  var rprev = byId("rprev"); if (rprev) rprev.onclick = function(){ if (reviewIdx > 0){ reviewIdx--; render(); } };
  var rnext = byId("rnext"); if (rnext) rnext.onclick = function(){ if (reviewIdx < TOTAL - 1){ reviewIdx++; render(); } };
  var restart = byId("restart");
  if (restart) restart.onclick = function(){
    ask("Start over?", "This clears every answer and returns you to question 1.",
        "Start over", function(){
      wipe(); idx = 0; answers = {}; pending = null; elapsed = 0; mode = "start"; render();
    });
  };
}

function beginTest(resume){
  var saved = resume ? load() : null;
  if (saved){
    idx = saved.idx || 0;
    answers = saved.answers || {};
    elapsed = typeof saved.elapsed === "number" ? saved.elapsed : 0;
  } else { wipe(); idx = 0; answers = {}; elapsed = 0; }
  pending = answers[DATA[idx].n] != null ? answers[DATA[idx].n] : null;
  mode = "test"; startTicker(); render();
}

function advance(){
  var q = DATA[idx];
  if (pending != null && norm(pending)) answers[q.n] = pending;
  if (idx === TOTAL - 1){
    ask("Finish the test?", "You will see your full answer sheet. You cannot return to the questions.",
        "Finish test", finish);
    return;
  }
  idx++;
  pending = answers[DATA[idx].n] != null ? answers[DATA[idx].n] : null;
  save(); render();
}

function finish(){ stopTicker(); mode = "results"; save(); render(); }

document.addEventListener("keydown", function(e){
  if (mode !== "test") return;
  var q = DATA[idx];
  if (q.type === "mc"){
    var k = e.key.toUpperCase();
    for (var i = 0; i < q.choices.length; i++){
      if (q.choices[i].letter === k){ pending = k; render(); return; }
    }
    if (e.key === "Enter") advance();
  }
});

render();
})();
</script>
</body>
</html>
